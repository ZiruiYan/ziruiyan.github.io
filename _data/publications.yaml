  - title: "Reward-oriented Causal Representation Learning"
    slug: "reward-oriented-causal-representation-learning"
    authors: " <strong><u>Zirui Yan</strong></u>*, Emre Acartürk*, Ali Tajer"
    citation_authors:
      - "Zirui Yan"
      - "Emre Acartürk"
      - "Ali Tajer"
    venue: "Proc. Neural Information Processing Systems <strong>(NeurIPS)</strong>"
    citation_conference_title: "Advances in Neural Information Processing Systems"
    citation_volume: "38"
    citation_doi: "10.52202/085713-1381"
    citation_firstpage: "41392"
    citation_lastpage: "41444"
    year: "2025"
    paper_page: "/publications/reward-oriented-causal-representation-learning/"
    paper_pdf: "https://openreview.net/pdf?id=I1hgynwxGZ"
    citation_pdf_url: "https://proceedings.neurips.cc/paper_files/paper/2025/file/3b04bba0f95caacbd9aa9033e2c913c9-Paper-Conference.pdf"
    code: "https://github.com/ZiruiYan/RO-CRL"
    abstract_source: "https://papers.neurips.cc/paper_files/paper/2025/hash/3b04bba0f95caacbd9aa9033e2c913c9-Abstract-Conference.html"
    abstract: >-
      Causal representation learning (CRL) is the process of disentangling the <em>latent</em> low-dimensional
      causally-related generating factors underlying high-dimensional observable data. Extensive recent studies
      have characterized CRL identifiability and <em>perfect</em> recovery of the latent variables and their
      attendant causal graph. This paper introduces the notion of <em>reward-oriented</em> CRL, the purpose of
      which is to move away from perfectly learning the latent representation and instead learning it to the
      extent needed for optimizing a desired downstream task (reward). In reward-oriented CRL, perfectly
      learning the latent representation can be excessive; instead, it must be learned at the <em>coarsest</em>
      level sufficient for optimizing the desired task. Reward-oriented CRL is formalized as the optimization
      of a desired function of the observable data over the space of all possible interventions and focuses
      on linear causal and transformation models. To sequentially identify the optimal subset of interventions,
      an adaptive exploration algorithm is designed that learns the latent causal graph and the variables
      needed to identify the best intervention. It is shown that for an \(n\)-dimensional latent space and a
      \(d\)-dimensional observation space, over a horizon \(T\) the algorithm's regret scales as
      \(\tilde O(d^{\frac{1}{3}}n^{\frac{1}{3}}u^{\frac{2}{3}}T^{\frac{2}{3}} + u\sqrt{T})\),
      where \(u\) measures total uncertainty in the graph estimates. Furthermore, an almost-matching lower
      bound is shown to scale as
      \(\Omega(d^{\frac{1}{3}}n^{\frac{1}{3}}p^{\frac{2}{3}}T^{\frac{2}{3}} + p\sqrt{T})\),
      in which \(u\) is replaced by \(p\) that counts the number of causal paths in the graph.
    bibtex: |-
      @inproceedings{yan2025reward,
        title={Reward-oriented Causal Representation Learning},
        author={Yan, Zirui and Acart{\"u}rk, Emre and Tajer, Ali},
        booktitle={Proc. Advances in Neural Information Processing Systems},
        year={2025},
        month={December},
        address={San Diego, CA}
      }
    selected: y
    label: "NeurIPS"

  - title: "Linear Causal Bandits: Unknown Graph and Soft Interventions"
    slug: "linear-causal-bandits-unknown-graph-and-soft-interventions"
    authors: " <strong><u>Zirui Yan</strong></u>, Ali Tajer"
    citation_authors:
      - "Zirui Yan"
      - "Ali Tajer"
    venue: "Proc. Neural Information Processing Systems <strong>(NeurIPS)</strong>"
    citation_conference_title: "Advances in Neural Information Processing Systems"
    citation_volume: "37"
    citation_doi: "10.52202/079017-0755"
    citation_firstpage: "23939"
    citation_lastpage: "23987"
    year: "2024"
    paper_page: "/publications/linear-causal-bandits-unknown-graph-and-soft-interventions/"
    paper_pdf: "https://arxiv.org/pdf/2411.02383"
    citation_pdf_url: "https://proceedings.neurips.cc/paper_files/paper/2024/file/2aba6ec20299931d46ddeefd5ddcb442-Paper-Conference.pdf"
    code: "https://github.com/ZiruiYan/Linear-Causal-Bandit-Unknown-Graph"
    abstract_source: "https://proceedings.neurips.cc/paper_files/paper/2024/hash/2aba6ec20299931d46ddeefd5ddcb442-Abstract-Conference.html"
    abstract: >-
      Designing causal bandit algorithms depends on two central categories of assumptions: (i) the extent
      of information about the underlying causal graphs and (ii) the extent of information about interventional
      statistical models. There have been extensive recent advances in dispensing with assumptions on either
      category. These include assuming known graphs but unknown interventional distributions, and the converse
      setting of assuming unknown graphs but access to restrictive hard/\(\operatorname{do}\) interventions,
      which removes the stochasticity and ancestral dependencies. Nevertheless, the problem in its general
      form, i.e., <em>unknown</em> graph and <em>unknown</em> stochastic intervention models, remains open.
      This paper addresses this problem and establishes that in a graph with \(N\) nodes, maximum in-degree
      \(d\) and maximum causal path length \(L\), after \(T\) interaction rounds the regret upper bound scales
      as \(\tilde{\mathcal{O}}((cd)^{L-\frac{1}{2}}\sqrt{T} + d + RN)\) where \(c>1\) is a constant and
      \(R\) is a measure of intervention power. A universal minimax lower bound is also established, which
      scales as \(\Omega(d^{L-\frac{3}{2}}\sqrt{T})\). Importantly, the graph size \(N\) has a diminishing
      effect on the regret as \(T\) grows. These bounds have matching behavior in \(T\), exponential dependence
      on \(L\), and polynomial dependence on \(d\) (with the gap \(d\ \)). On the algorithmic aspect, the
      paper presents a novel way of designing a computationally efficient CB algorithm, addressing a challenge
      that the existing CB algorithms using soft interventions face.
    bibtex: |-
      @inproceedings{yan2024linear,
        title={Linear Causal Bandits: Unknown Graph and Soft Interventions},
        author={Yan, Zirui and Tajer, Ali},
        booktitle={Proc. Advances in Neural Information Processing Systems},
        year={2024},
        month={December},
        address={Vancouver, Canada}
      }
    selected: y
    label: "NeurIPS"

  - title: "Improved Bound for Robust Causal Bandits with Linear Models"
    slug: "improved-bound-for-robust-causal-bandits-with-linear-models"
    authors: "<strong><u>Zirui Yan</strong></u>, Arpan Mukherjee, Burak Varıcı, Ali Tajer"
    citation_authors:
      - "Zirui Yan"
      - "Arpan Mukherjee"
      - "Burak Varıcı"
      - "Ali Tajer"
    venue: "Proc. IEEE International Symposium on Information Theory <strong>(ISIT)</strong>"
    citation_conference_title: "2024 IEEE International Symposium on Information Theory (ISIT)"
    citation_doi: "10.1109/ISIT57864.2024.10619195"
    citation_firstpage: "2074"
    citation_lastpage: "2079"
    year: "2024"
    paper_page: "/publications/improved-bound-for-robust-causal-bandits-with-linear-models/"
    paper_pdf: "https://ieeexplore.ieee.org/document/10619195"
    citation_pdf_url: "https://arxiv.org/pdf/2405.07795"
    abstract_source: "https://arxiv.org/html/2405.07795v1"
    abstract: >-
      This paper investigates the robustness of causal bandits (CBs) in the face of temporal model
      fluctuations. This setting deviates from the existing literature’s widely-adopted assumption of
      constant causal models. The focus is on causal systems with linear structural equation models (SEMs).
      The SEMs and the time-varying pre- and post-interventional statistical models are all unknown and subject
      to variations over time. The goal is to design a sequence of interventions that incur the smallest
      cumulative regret compared to an oracle aware of the entire causal model and its fluctuations. A robust
      CB algorithm is proposed, and its cumulative regret is analyzed by establishing both upper and lower
      bounds on the regret. It is shown that in a graph with maximum in-degree \(d\), length of the largest
      causal path \(L\), and an aggregate model deviation \(C\), the regret is upper bounded by
      \(\tilde{\mathcal{O}}(d^{L-\frac{1}{2}}(\sqrt{T} + C))\) and lower bounded by
      \(\Omega(d^{\frac{L}{2}-2}\max\{\sqrt{T}\; ,\; d^2C\})\). The proposed algorithm achieves nearly
      optimal \(\tilde{\mathcal{O}}(\sqrt{T})\) regret when \(C\) is \(o(\sqrt{T})\), maintaining sub-linear
      regret for a broad range of \(C\).
    bibtex: |-
      @inproceedings{yan2024improved,
        title={Improved Bound for Robust Causal Bandits with Linear Models},
        author={Yan, Zirui and Mukherjee, Arpan and Varici, Burak and Tajer, Ali},
        booktitle={Proc. IEEE International Symposium on Information Theory},
        year={2024},
