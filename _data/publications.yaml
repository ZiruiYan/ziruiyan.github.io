    label: "UAI CDM"

  - title: "Multi-component Causal Tracing in Large Language Models"
    slug: "multi-component-causal-tracing-in-large-language-models"
    authors: " <strong><u>Zirui Yan</strong></u>, Dennis Wei, Dmitriy A. Katz, Prasanna Sattigeri, Ali Tajer"
    citation_authors:
      - "Zirui Yan"
      - "Dennis Wei"
      - "Dmitriy A. Katz"
      - "Prasanna Sattigeri"
      - "Ali Tajer"
    venue: "Proc. Annual Meeting of the Association for Computational Linguistics <strong>(ACL)</strong>"
    citation_conference_title: "Proceedings of the 64th Annual Meeting of the Association for Computational Linguistics (Volume 1: Long Papers)"
    citation_doi: "10.18653/v1/2026.acl-long.154"
    citation_firstpage: "3398"
    citation_lastpage: "3418"
    year: "2026"
    paper_page: "/publications/multi-component-causal-tracing-in-large-language-models/"
    paper_pdf: "https://aclanthology.org/2026.acl-long.154.pdf"
    citation_pdf_url: "https://aclanthology.org/2026.acl-long.154.pdf"
    code: "https://github.com/ZiruiYan/multi-component-causal-tracing"
    abstract_source: "https://aclanthology.org/2026.acl-long.154/"
    abstract: >-
      Causal tracing systematically intervenes on a large language model’s (LLM’s) internal representations
      to uncover and quantify the causal pathways linking specific inputs or computations to specific metrics
      of interest, quantifying the LLM’s behavior. Building on previous single-component or single-layer studies,
      this paper presents a unified framework for causally tracing multiple components simultaneously. This
      framework systematically identifies the subsets of components (e.g., attention heads and multi-layer
      perceptron neurons) most critical to a desired target performance metric (e.g., accuracy and fairness).
      This is achieved by incorporating flexible interventions applied to a wide range of desired metrics.
      To address the combinatorial complexity of the multi-component problem, an efficient algorithm is
      designed that leverages soft interventions and a carefully designed metric transformation, converting
      the combinatorial search problem into a continuous one that can be solved efficiently under proper
      constraints, thereby generating proper binary decisions for selecting components. Experimental results
      demonstrate that the proposed method efficiently identifies subsets of the model’s components that have
      a high impact on the target metric, outperforming existing baseline approaches.
    bibtex: |-
      @inproceedings{yan2026multi,
        title={Multi-component Causal Tracing in Large Language Models},
        author={Yan, Zirui and Wei, Dennis and Katz, Dmitriy A and Sattigeri, Prasanna and Tajer, Ali},
        booktitle={Proc. Annual Meeting of the Association for Computational Linguistics},
        year={2026},
        month={July},
        address={San Diego, CA}
      }
