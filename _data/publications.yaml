        title={Optimizing Parameter Mixing Under Constrained Communications in Parallel Federated Learning},
        author={Liu, Xuezheng and Yan, Zirui and Zhou, Yipeng and Wu, Di and Chen, Xu and Wang, Jessie Hui},
        journal={IEEE/ACM Transactions on Networking},
        volume={31},
        number={6},
        pages={2640--2652},
        year={2023}
      }
