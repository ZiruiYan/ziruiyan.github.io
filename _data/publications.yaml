  - title: "Optimizing Parameter Mixing under Constrained Communications in Parallel Federated Learning"
    slug: "optimizing-parameter-mixing-under-constrained-communications-in-parallel-federated-learning"
    authors: "Xuezheng Liu*, <strong><u>Zirui Yan</strong></u>*, Yipeng Zhou , Di Wu , Xu Chen , Jessie Hui Wang (* equal contributor)"
    citation_authors:
      - "Xuezheng Liu"
      - "Zirui Yan"
      - "Yipeng Zhou"
      - "Di Wu"
      - "Xu Chen"
      - "Jessie Hui Wang"
    venue: "IEEE/ACM Trans. on Networking <strong>(TON)</strong>"
    citation_journal_title: "IEEE/ACM Transactions on Networking"
    citation_volume: "31"
    citation_issue: "6"
    citation_doi: "10.1109/TNET.2023.3257236"
    citation_firstpage: "2640"
    citation_lastpage: "2652"
    year: "2023"
    paper_page: "/publications/optimizing-parameter-mixing-under-constrained-communications-in-parallel-federated-learning/"
    paper_pdf: "https://ieeexplore.ieee.org/document/10082940/"
    abstract_source: "https://researchers.mq.edu.au/en/publications/optimizing-parameter-mixing-under-constrained-communications-in-p/"
    abstract: >-
      In vanilla Federated Learning (FL) systems, a centralized parameter server (PS) is responsible for
      collecting, aggregating and distributing model parameters with decentralized clients. However, the
      communication link of a single PS can be easily overloaded by concurrent communications with a massive
      number of clients. To overcome this drawback, multiple PSes can be deployed to form a parallel FL (PFL)
      system, in which each PS only communicates with a subset of clients and its neighbor PSes. On one hand,
      each PS conducts iterations with clients in its subset. On the other hand, PSes communicate with each
      other periodically to mix their parameters so that they can finally reach a consensus. In this paper,
      we propose a novel parallel federated learning algorithm called Fed-PMA, which optimizes such parallel
      FL under constrained communications by conducting parallel parameter mixing and averaging with theoretic
      guarantees. We formally analyze the convergence rate of Fed-PMA with convex loss, and further derive the
      optimal number of times each PS should mix with its neighbor PSes so as to maximize the final model
      accuracy within a fixed span of training time. Theoretical study manifests that PSes should mix their
      parameters more frequently if the connection between PSes is sparse or the time cost of mixing is low.
      Inspired by our analysis, we propose the Fed-APMA algorithm that can adaptively determine the near-optimal
      number of mixing times with non-convex loss under dynamic communication conditions. Extensive experiments
      with realistic datasets are carried out to demonstrate that both Fed-PMA and its adaptive version
      Fed-APMA significantly outperform the state-of-the-art baselines.
    bibtex: |-
