  - title: "Federated Multi-armed Bandit via Uncoordinated Exploration"
    slug: "federated-multi-armed-bandit-via-uncoordinated-exploration"
    authors: "<strong><u>Zirui Yan</strong></u>, Quan Xiao, Tianyi Chen, Ali Tajer"
    citation_authors:
      - "Zirui Yan"
      - "Quan Xiao"
      - "Tianyi Chen"
      - "Ali Tajer"
    venue: "Proceedings of IEEE International Conference on Acoustics, Speech, and Signal Processing <strong>(ICASSP)</strong>"
    citation_conference_title: "ICASSP 2022 - 2022 IEEE International Conference on Acoustics, Speech and Signal Processing (ICASSP)"
    citation_doi: "10.1109/ICASSP43922.2022.9747833"
    citation_firstpage: "5248"
    citation_lastpage: "5252"
    year: "2022"
    paper_page: "/publications/federated-multi-armed-bandit-via-uncoordinated-exploration/"
    paper_pdf: "https://ieeexplore.ieee.org/iel7/9745891/9746004/09747833.pdf"
    citation_pdf_url: "https://par.nsf.gov/servlets/purl/10327194"
    abstract_source: "https://par.nsf.gov/servlets/purl/10327194"
    abstract: >-
      A wide range of multi-agent decision-making problems can be abstracted as a federated multi-armed
      bandit (FMAB) problem. A key challenge of the FMAB problem is that the exploration-exploitation dichotomy
      inherited from the multi-armed bandit aspect is compounded with data heterogeneity in federated learning.
      This renders the exploration and exploitation of different agents inherently entangled. This paper
      focuses on overcoming the difficulty of exploration in FMAB problems, and it proposes a novel federated
      upper confidence bound (UCB) algorithm that requires uncoordinated exploration (UE) decisions by the
      agents. The major distinction of this algorithm, referred to as FedUCB-UE, with the existing FMAB
      algorithms is that it allows the agents to explore the non-optimal arms and make personalized
      arm-selection decisions without coordination. While such uncoordinated exploration makes the regret
      analysis non-trivial, it comes with both the theoretical and empirical benefit of diversity in
      explorations. Under certain mild assumptions, this paper establishes that FedUCB-UE has a
      \(\mathcal{O}(\log T)\) regret bound. Furthermore, experiments performed on synthetic datasets show
      that FedUCB-UE outperforms the state-of-the-art algorithms.
    bibtex: |-
      @inproceedings{yan2022federated,
        title={Federated Multi-Armed Bandit Via Uncoordinated Exploration},
        author={Yan, Zirui and Xiao, Quan and Chen, Tianyi and Tajer, Ali},
        booktitle={Proc. IEEE International Conference on Acoustics, Speech and Signal Processing},
        year={2022},
        month={May},
        address={Singapore}
      }
